services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vector-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vector
      POSTGRES_PASSWORD: vector_dev_password
      POSTGRES_DB: vector
    ports:
      - "5432:5432"
    volumes:
      - vector_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector -d vector"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  vector_db_data: