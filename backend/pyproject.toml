[project]
name = "vector-backend"
version = "0.1.0"
description = "Vector — Commando IA Analyse de Données"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Framework web
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "email-validator==2.3.0",

    # Base de données
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.10",
    "alembic==1.13.3",
    "pgvector==0.3.6",

    # Authentification
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-multipart==0.0.17",

    # IA et LLM
    "openai==1.54.4",
    # httpx>=0.28 a retire le kwarg "proxies" qu'openai==1.54.4 passe en
    # interne (TypeError au premier client OpenAI instancie) -- deja pinne
    # a 0.27.2 dans les dev-deps (tests), manquant ici cote prod (pip
    # install . sans [dev] resolvait 0.28.1 en container, jamais reproduit
    # en local ou le venv datait d'avant cette regression httpx).
    "httpx==0.27.2",
    "tiktoken==0.8.0",
    "tavily-python==0.5.0",

    # Données
    "pandas==2.2.3",
    "numpy==2.1.3",
    "openpyxl==3.1.5",
    "chardet==5.2.0",
    "pillow==12.2.0",

    # RAG (parsing documents)
    "pymupdf==1.24.10",
    "python-docx==1.1.2",
    "python-pptx==1.0.2",
    "langchain-text-splitters==0.3.2",
    "sse-starlette==2.1.3",

    # Templating
    "jinja2==3.1.4",

    # Démo publique Render (S5 J55) : rate limiting in-memory + scheduler
    # interne (remplace Celery/Redis, jamais branchés — voir
    # docs/DEPLOYMENT_RENDER.md §2/§6)
    "slowapi==0.1.10",
    "apscheduler==3.11.3",

    # Utilitaires
    "aiofiles==24.1.0",
    "tenacity==9.0.0",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "faker==33.1.0",
    "reportlab==4.2.5",
    "ruff==0.7.4",
    "mypy==1.13.0",
    "pandas==2.2.3",
    "openpyxl==3.1.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (formattée par black si utilisé)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]  # assert False dans les tests
"migrations/*" = ["E402", "F401"]  # imports après code, imports inutilisés

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: tests lents (> 1s)",
    "integration: tests qui touchent la BDD via l'API",
    "unit: tests unitaires purs (pas de DB ni d'API)",
]

[tool.coverage.run]
# S5 J53 : SQLAlchemy async utilise greenlet_spawn en interne (pont
# sync/async pour le driver asyncpg) -- sans ce concurrency, coverage.py
# perd le fil apres chaque commit/refresh et sous-rapporte massivement
# tout endpoint qui ecrit en base (ex: app/api/auth.py mesurait 53% avant
# ce fix, 100% apres, sans qu'aucun test n'ait change).
concurrency = ["greenlet", "thread"]
source = ["app"]

[tool.coverage.report]
# TODO: remonter à 75 après ajout tests Phase 2 (demo_guard, limiter, seed_demo, demo_cleanup)
fail_under = 73
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]